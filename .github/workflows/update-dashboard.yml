name: Update Dashboard

on:
  schedule:
    # Every 30 min during market hours (EDT = UTC-4)
    # 9:17 AM – 4:47 PM ET = 13:17 – 20:47 UTC
    # :17 and :47 offsets avoid top-of-hour GitHub scheduler congestion
    - cron: '17,47 13-20 * * 1-5'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # Needed to push docs/index.html back to repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python dashboard_generator.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/favicon.png
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update dashboard $(date -u +%H:%M) UTC"
          git push
