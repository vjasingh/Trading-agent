name: Morning Trading Brief

on:
# schedule:
 #   # 6:17 AM ET = 10:17 UTC (EDT, Mar-Nov); absorbs GitHub's typical scheduling delays
 #   - cron: '17 10 * * 1-5'
#   DISABLED — now triggered by cron-job.org at exactly 11:00 UTC (7 AM ET)
  workflow_dispatch:  # Allows manual trigger from GitHub UI for testing

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run trading agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: python agent_v4.py

      - name: Commit recommendation log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendations_log.csv data/latest_brief.json
          git diff --staged --quiet || git commit -m "Log recommendations $(date +%Y-%m-%d)"
          git push
