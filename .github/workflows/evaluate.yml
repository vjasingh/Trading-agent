name: Weekly Trade Evaluation

on:
  schedule:
    # Every Friday at 22:00 UTC = 6 PM ET (after market close)
    - cron: '0 22 * * 5'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Allow pushing updated CSV back to repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python evaluate_recommendations.py

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendations_log.csv
          git diff --staged --quiet || git commit -m "Update outcomes $(date +%Y-%m-%d)"
          git push
